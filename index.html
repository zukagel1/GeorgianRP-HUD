<!DOCTYPE html>
<html lang="ka"><head><meta charset="utf-8"><title>Georgian RP | HUD</title>
<link rel="stylesheet" href="style.css"></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="drop" viewBox="0 0 24 24"><path d="M12 2.5c3.6 4.3 6 7.4 6 10.6A6 6 0 0 1 6 13.1C6 9.9 8.4 6.8 12 2.5z"/></symbol>
<symbol id="food" viewBox="0 0 24 24"><path d="M4 10a8 6 0 0 1 16 0zM3 12h18v2H3zM4 16h16v1a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z"/></symbol>
<symbol id="heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></symbol>
<symbol id="shield" viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10V5z"/></symbol>
<symbol id="lock" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2 0h6V7a3 3 0 0 0-6 0z"/></symbol>
<symbol id="mic" viewBox="0 0 24 24"><path d="M12 2a3.5 3.5 0 0 1 3.5 3.5v6a3.5 3.5 0 0 1-7 0v-6A3.5 3.5 0 0 1 12 2zM6 11h2a4 4 0 0 0 8 0h2a6 6 0 0 1-5 5.9V20h3v2H8v-2h3v-3.1A6 6 0 0 1 6 11z"/></symbol>
<symbol id="star" viewBox="0 0 24 24"><path d="M12 2l3 6.5 7 .9-5.2 4.8 1.4 7L12 17.8 5.8 21.2l1.4-7L2 9.4l7-.9z"/></symbol>
<symbol id="eng" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1 5h2v7h-2zm0 9h2v2h-2z"/></symbol>
<symbol id="belt" viewBox="0 0 24 24"><path d="M12 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6zM7 22l1-10 4 3 4-3 1 10h-3l-.6-5L12 19l-1.4-2L10 22z"/></symbol>
<symbol id="key" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M8 3a5 5 0 0 1 4.9 6H22v4h-3v3h-3v-3h-3.1A5 5 0 1 1 8 3zm0 3a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></symbol>
<symbol id="fuel" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M4 21V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v7h1.5a2.5 2.5 0 0 1 2.5 2.5V17a1 1 0 0 0 2 0V9l-2-2 1.5-1.5L22 8v9a3 3 0 0 1-6 0v-2.5a.5.5 0 0 0-.5-.5H15v7zm3-14v4h6V7z"/></symbol>
<symbol id="warn" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 3l10 18H2zm-1 7v5h2v-5zm0 6.5v2h2v-2z"/></symbol>
<symbol id="info" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1 5h2v2h-2zm0 4h2v6h-2z"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><path d="M9.5 16.2L5.3 12l-1.4 1.4 5.6 5.6L21 7.5l-1.4-1.4z"/></symbol>
<symbol id="vip" viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9z"/></symbol>
<symbol id="card" viewBox="0 0 24 16"><path fill-rule="evenodd" d="M2 0h20a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2zm-.5 4v2h21V4z"/></symbol>
<symbol id="cash" viewBox="0 0 24 16"><path fill-rule="evenodd" d="M0 2h24v12H0zm12 2a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></symbol>
</defs></svg>

<div id="hud">
 <div id="tr">
  <div id="brandline"><span id="x2" class="hide">x2 PayDay</span><div id="logo">Georgian RP<i id="dot"></i></div></div>
  <div class="row"><span>Online : <b id="online">0</b></span><span id="nick"><svg class="i" style="width:27px;height:27px"><use href="#vip"/></svg><b id="name">-</b></span></div>
  <div class="row" style="margin-top:6px"><b id="pid">#00000</b><div id="stars"></div></div>
   <div id="gun"><div id="gb" class="no"><img id="gi" alt=""></div><div class="gt"><span id="gn"></span><small id="ga"></small></div></div>
  
  <div class="mult hide" id="x4"><span>X4</span> Donate</div>
  <div id="quest"><div class="qm"><div class="qt">გაატარე სერვერზე : <b id="qh">0/</b><span id="qg">4</span></div><div class="qr">უფასო საჩუქარი</div></div>
  <div class="qtime"><b id="qt">5:00:00</b><small id="qsm">დარჩენილია</small></div>
  <div class="qs"><div id="qi">ⓘ</div><div id="qc">›</div></div></div>
 </div>

 

 <div class="kb" style="top:calc(50% + -177px)"><i>I</i>Inventory</div>
 <div class="kb" style="top:calc(50% + -119px)"><i>F11</i>Voice Menu</div>
 <div class="kb" style="top:calc(50% + -67px)"><i>M</i>Mobile Phone</div>
 <div class="kb" style="top:calc(50% + -12px)"><i>T</i>Main Chat</div>
 <div class="kb" style="top:calc(50% + 40px)"><i>B</i>Microphone</div>
 <div id="dm"></div>

 <div id="bl">
  <div id="sts">
   <div class="st" id="sHP" style="--c:#ff4d4d"><div class="fl"></div><svg><use href="#heart"/></svg></div>
   <div class="st" id="sAR" style="--c:#4da6ff"><div class="fl"></div><svg><use href="#shield"/></svg></div>
   <div class="st" id="sT" style="--c:#2f8cff"><div class="fl"></div><svg><use href="#drop"/></svg></div>
   <div class="st" id="sH" style="--c:#ff9d2e"><div class="fl"></div><svg><use href="#food"/></svg></div>
   <div class="st hide" id="sG" style="--c:#35e03a"><div class="fl" style="height:100%"></div><svg><use href="#shield"/></svg></div>
   <div class="st hide" id="sD" style="--c:#ff3b3b"><div class="fl" style="height:100%"></div><svg><use href="#lock"/></svg></div>
  </div>
  <div class="wx"><span id="wt">+ 15</span><i class="sun"></i><span id="wd">სუფთა</span></div>
  <div id="tm"><span id="clk">00:00</span><small id="dt">00.00.0000</small></div>
  <div id="dy">-</div>
  <div class="mn" id="mc"><svg><use href="#cash"/></svg><span>$0</span></div>
  <div class="mn" id="mb"><svg><use href="#card"/></svg><span>$0</span></div>
 </div>

 
 <div id="notes"></div>


 <div id="veh">
  <div id="kmh">KM/H</div><div id="sp"><div id="gear">N</div><div id="spd">0</div></div>
  <div id="vi"><svg id="vE"><use href="#eng"/></svg><svg id="vB" style="display:none"><use href="#belt"/></svg><svg id="vL"><use href="#key"/></svg>
   <div id="fuel"><svg><use href="#fuel"/></svg><div><b id="fv">0</b><span id="fm">/100L</span></div></div></div>
 </div>
</div>
